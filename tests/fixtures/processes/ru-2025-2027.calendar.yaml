# yaml-language-server: $schema=../../../../packages/schema/v1/object.schema.json
# The calendar `ru` of the package platform-calendars (superproject,
# packages/platform-calendars/calendars/ru.yaml, years 2025-2027) with the
# working hours CP-ADR-0078 §2 gives it: 09:00-18:00, a short day one hour
# shorter. Reference data of the working-time control set (SC-004).
apiVersion: taimen.ai/v1
kind: Calendar
key: ru
spec:
  displayName: Производственный календарь РФ
  timezone: Europe/Moscow
  weekend: [6, 7]
  workingHours:
    intervals: [{from: "09:00", to: "18:00"}]
    shortDayReduction: PT1H
  years:
    # 2025: 247 рабочих дней, 118 выходных и праздничных, норма 1972 ч при 40-часовой неделе.
    # Переносы: сб 4 янв → пт 2 мая; вс 5 янв → ср 31 дек; вс 23 фев → чт 8 мая;
    # сб 8 мар → пт 13 июн; сб 1 ноя → пн 3 ноя (1 ноября — рабочая суббота).
    - year: 2025
      source: >-
        Постановление Правительства РФ от 04.10.2024 № 1335 «О переносе выходных
        дней в 2025 году»; ст. 112 ТК РФ
      holidays:
        # новогодние каникулы и Рождество (ст. 112)
        - "2025-01-01"
        - "2025-01-02"
        - "2025-01-03"
        - "2025-01-04"
        - "2025-01-05"
        - "2025-01-06"
        - "2025-01-07"
        - "2025-01-08"
        - "2025-02-23"  # воскресенье, перенесено на 8 мая
        - "2025-03-08"  # суббота, перенесено на 13 июня
        - "2025-05-01"
        - "2025-05-02"  # перенос с 4 января
        - "2025-05-08"  # перенос с 23 февраля
        - "2025-05-09"
        - "2025-06-12"
        - "2025-06-13"  # перенос с 8 марта
        - "2025-11-03"  # перенос с 1 ноября
        - "2025-11-04"
        - "2025-12-31"  # перенос с 5 января
      workdays:
        - "2025-11-01"  # суббота, выходной перенесён на 3 ноября
      shortDays:
        - "2025-03-07"
        - "2025-04-30"
        - "2025-06-11"
        - "2025-11-01"

    # 2026: 247 рабочих дней, 118 выходных и праздничных, норма 1972 ч.
    # Переносы постановлением: сб 3 янв → пт 9 янв; вс 4 янв → чт 31 дек.
    # По ч. 2 ст. 112: вс 8 мар → пн 9 мар; сб 9 мая → пн 11 мая.
    - year: 2026
      source: >-
        Постановление Правительства РФ от 24.09.2025 № 1466 «О переносе выходных
        дней в 2026 году»; ст. 112 ТК РФ
      holidays:
        - "2026-01-01"
        - "2026-01-02"
        - "2026-01-03"
        - "2026-01-04"
        - "2026-01-05"
        - "2026-01-06"
        - "2026-01-07"
        - "2026-01-08"
        - "2026-01-09"  # перенос с 3 января
        - "2026-02-23"
        - "2026-03-08"  # воскресенье
        - "2026-03-09"  # перенос с 8 марта (ч. 2 ст. 112)
        - "2026-05-01"
        - "2026-05-09"  # суббота
        - "2026-05-11"  # перенос с 9 мая (ч. 2 ст. 112)
        - "2026-06-12"
        - "2026-11-04"
        - "2026-12-31"  # перенос с 4 января
      workdays: []
      shortDays:
        - "2026-04-30"
        - "2026-05-08"
        - "2026-06-11"
        - "2026-11-03"

    # 2027: 247 рабочих дней, 118 выходных и праздничных, норма 1972 ч.
    # Переносы постановлением: сб 2 янв → пт 5 ноя; вс 3 янв → пт 31 дек;
    # сб 20 фев → пн 22 фев (20 февраля — рабочая суббота).
    # По ч. 2 ст. 112: сб 1 мая → пн 3 мая; вс 9 мая → пн 10 мая; сб 12 июн → пн 14 июн.
    - year: 2027
      source: >-
        Постановление Правительства РФ от 17.09.2026 № 1187 «О переносе выходных
        дней в 2027 году»; ст. 112 ТК РФ
      holidays:
        - "2027-01-01"
        - "2027-01-02"
        - "2027-01-03"
        - "2027-01-04"
        - "2027-01-05"
        - "2027-01-06"
        - "2027-01-07"
        - "2027-01-08"
        - "2027-02-22"  # перенос с 20 февраля
        - "2027-02-23"
        - "2027-03-08"
        - "2027-05-01"  # суббота
        - "2027-05-03"  # перенос с 1 мая (ч. 2 ст. 112)
        - "2027-05-09"  # воскресенье
        - "2027-05-10"  # перенос с 9 мая (ч. 2 ст. 112)
        - "2027-06-12"  # суббота
        - "2027-06-14"  # перенос с 12 июня (ч. 2 ст. 112)
        - "2027-11-04"
        - "2027-11-05"  # перенос со 2 января
        - "2027-12-31"  # перенос с 3 января
      workdays:
        - "2027-02-20"  # суббота, выходной перенесён на 22 февраля
      shortDays:
        - "2027-02-20"
        - "2027-04-30"
        - "2027-06-11"
        - "2027-11-03"
