# Two stages each waiting for the other.
# expect: unreachable_stage /spec/stages/1/entry
# expect: unreachable_stage /spec/stages/2/entry
apiVersion: taimen.ai/v1
kind: Process
key: sample
spec:
  version: 1
  displayName: Sample
  identity: {agent: sample-process}
  owner: [{role: lead}]
  data: {type: object, properties: {number: {type: string}}}
  start: {on: {observation: sample.opened}, key: event.payload.number, set: {number: "'1'"}}
  stages:
    - id: first
      steps: [{id: one, set: {number: "'1'"}}]
    - id: second
      entry: stage.third.completed
      steps: [{id: two, set: {number: "'2'"}}]
    - id: third
      entry: stage.second.completed
      steps: [{id: three, set: {number: "'3'"}}]
