# A unique table whose rules 0 and 1 both match 500.
# expect: table_overlap /spec/decisions/0/rules/1
apiVersion: taimen.ai/v1
kind: Process
key: sample
spec:
  version: 1
  displayName: Sample
  identity: {agent: sample-process}
  owner: [{role: lead}]
  data: {type: object, properties: {number: {type: string}, amount: {type: number}, level: {type: number}}}
  start: {on: {observation: sample.opened}, key: event.payload.number, set: {number: "'1'", amount: "100.0"}}
  decisions:
    - id: level
      hitPolicy: unique
      inputs: [{id: amount, expr: data.amount}]
      outputs: [{id: level, type: number}]
      rules:
        - {when: {amount: "[0..1000]"}, then: {level: 1}}
        - {when: {amount: ">=500"}, then: {level: 2}}
        - {when: {amount: "<0"}, then: {level: 0}}
  stages:
    - id: work
      steps: [{id: pick, decide: {table: level}, output: {as: {level: step.result.level}}}]
