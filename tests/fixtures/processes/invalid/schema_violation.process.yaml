# A step of two kinds: a shape error of the catalog schema.
# expect: schema_violation /spec/stages/0/steps/0
apiVersion: taimen.ai/v1
kind: Process
key: sample
spec:
  version: 1
  displayName: Sample
  identity: {agent: sample-process}
  owner: [{role: lead}]
  data: {type: object, properties: {number: {type: string}}}
  start: {on: {observation: sample.opened}, key: event.payload.number}
  stages:
    - id: work
      steps:
        - id: two
          set: {number: "'x'"}
          complete: {outcome: done}
