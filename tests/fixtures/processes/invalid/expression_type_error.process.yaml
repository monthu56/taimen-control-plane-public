# A read of a field the data does not declare, and a guard that is not bool.
# expect: expression_type_error /spec/stages/0/exit
# expect: expression_type_error /spec/stages/0/steps/0/when
apiVersion: taimen.ai/v1
kind: Process
key: sample
spec:
  version: 1
  displayName: Sample
  identity: {agent: sample-process}
  owner: [{role: lead}]
  data: {type: object, properties: {number: {type: string}, decision: {type: string}}}
  start: {on: {observation: sample.opened}, key: event.payload.number, set: {number: "'1'"}}
  stages:
    - id: work
      steps:
        - id: decide
          when: data.number
          set: {decision: "'go'"}
      exit: data.decison == 'go'
