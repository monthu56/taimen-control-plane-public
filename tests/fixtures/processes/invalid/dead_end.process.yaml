# The exit reads a field nothing writes: the stage never ends.
# expect: dead_end /spec/stages/0/exit
# expect: unwritten_data_field /spec/stages/0/exit
apiVersion: taimen.ai/v1
kind: Process
key: sample
spec:
  version: 1
  displayName: Sample
  identity: {agent: sample-process}
  owner: [{role: lead}]
  data: {type: object, properties: {number: {type: string}, approved: {type: boolean}}}
  start: {on: {observation: sample.opened}, key: event.payload.number, set: {number: "'1'"}}
  stages:
    - id: work
      steps: [{id: one, set: {number: "'2'"}}]
      exit: data.approved == true
