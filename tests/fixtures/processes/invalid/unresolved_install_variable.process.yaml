# The installer substitutes ${…}; the core receives the workspace id.
# expect: unresolved_install_variable /spec/workspaceId
apiVersion: taimen.ai/v1
kind: Process
key: sample
spec:
  version: 1
  displayName: Sample
  workspaceId: "${WORKSPACE_ID}"
  identity: {agent: sample-process}
  owner: [{role: lead}]
  data: {type: object, properties: {number: {type: string}}}
  start: {on: {observation: sample.opened}, key: event.payload.number, set: {number: "'1'"}}
  stages:
    - id: work
      steps: [{id: one, set: {number: "'2'"}}]
