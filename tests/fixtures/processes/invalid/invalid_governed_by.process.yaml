apiVersion: taimen.ai/v1
kind: Process
key: sample
spec:
  version: 1
  displayName: Sample
  identity: {agent: sample-process}
  owner: [{role: lead}]
  governedBy: [{document: "regulation:sample", section: "1"}, {document: "regulation:sample", section: "1"}]
  data: {type: object, properties: {number: {type: string}}}
  start: {on: {observation: sample.opened}, key: event.payload.number, set: {number: "'1'"}}
  stages:
    - id: work
      governedBy: [{document: " regulation:sample"}]
      steps: [{id: one, set: {number: "'2'"}}]
