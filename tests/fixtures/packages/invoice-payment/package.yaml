# Пакет-фикстура второго домена (CP-ADR-0067 §9, SC-007): оплата счетов поставщиков.
# Только данные в формате пакетов суперпроекта (TAI-ADR-0044): тип задачи, роль,
# скилл и правила. Ядро control-plane этих понятий не знает; integration-тест
# tests/integration/test_invoice_payment_package.py ставит пакет через публичный
# API и проходит на нём сценарии стадии проверки. Не поставляется: живёт в тестах.
apiVersion: taimen.ai/v1
kind: Package
key: invoice-payment
spec:
  version: 0.1.0
  displayName: Invoice payment (test fixture)
  description: >-
    Работа «оплатить счёт поставщика» с тремя критериями приёмки разных видов:
    сверка суммы платёжного поручения со счётом (скилл), факт «платёж проведён
    банком» (наблюдение) и подтверждение финансового директора (решение
    approval). Счёт получен — работа; счёт отозван — отмена; платёж
    проведён — закрытие как выполненной.
  requires: []
