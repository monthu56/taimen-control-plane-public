# Recorded facts the expressions of selfdev, sdd and notify are evaluated on,
# once in their earlier syntax and once translated into CEL (CP-ADR-0075 §7).
#
# events — journal events in the shapes the event catalog records
# (observation.recorded of the git connector, task.completed,
# task.verification_failed), with what a work rule reads next to them: the
# task view, the interpreting skill's invocation and the forEach items.
# Some lack fields on purpose: a missing value must read the same way.
#
# decisions — what an approval outcome, an acceptance check or a context
# anchor reads: the task (with the newest artifact per type), the task it was
# spawned by, the decided approval and the skill invocation an
# onSuccess/onFailure reacts to.
