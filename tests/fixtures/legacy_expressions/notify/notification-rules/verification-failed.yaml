# yaml-language-server: $schema=../../schema/v1/object.schema.json
# Проверка приёмки не пройдена, задача вернулась в работу (task.verification_failed,
# blocked ≠ true) — владельцу задачи, иначе исполнителю. ADR-0005 §8 сервиса.
apiVersion: taimen.ai/v1
kind: NotificationRule
key: verification-failed
spec:
  description: Проверка приёмки не пройдена, задача вернулась в работу.
  "on":
    type: task.verification_failed
    when: {ne: [{var: payload.blocked}, true]}
  recipient: {kind: taskOwner, fallback: taskAssignee}
  notification:
    type: task.verification_failed
    title: "Проверка не пройдена: {{task.publicId}} {{task.title}}"
    body: |-
      Попытка {{payload.attempt}}: не пройдена проверка «{{payload.failedCheck}}».
      Причина: {{payload.reason}}
      Задача вернулась в работу (статус {{payload.status}}).
    links:
      - {label: Открыть задачу, url: "${TASK_URL_BASE}/{{task.publicId}}"}
  dedupKeyTemplate: "control-plane:event:{{event.id}}"
